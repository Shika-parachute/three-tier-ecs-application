services:

  mongodb:
    build: ./mongodb
    container_name: three-tier-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: three_tier_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      three-tier-network:
        aliases:
          - mongodb.three-tier.local

  backend:
    build: ./backend
    container_name: three-tier-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb.three-tier.local:27017
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      three-tier-network:
        aliases:
          - backend.three-tier.local

  frontend:
    build: ./frontend
    container_name: three-tier-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - three-tier-network

networks:
  three-tier-network:

volumes:
  mongodb_data: